version: 2

updates:
  - package-ecosystem: npm
    directory: /
    rebase-strategy: auto
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    versioning-strategy: increase
    ignore:
      # Pinned to the exact waku version vocs supports: vocs' client/router code
      # imports internal waku subpaths (e.g. `router/client-core`), so a
      # mismatched waku fails the docs build or white-screens the site
      # (react-dropzone#1512, #1531). vocs 2.10 migrated to waku 1.0.0-rc.1, so
      # the pin moves in lockstep with vocs. Bump this by hand alongside vocs,
      # never on its own.
      - dependency-name: "waku"
    # Patch bumps grouped into one PR (auto-merged on green CI); minor bumps
    # grouped into a separate PR for manual review; majors open individually.
    groups:
      # Vitest and @vitest/coverage-v8 share a version-coupled coverage payload
      # format, so bumping one without the other breaks `vitest run --coverage`
      # (react-dropzone#1530). Keep them in lockstep across every update type;
      # listed first so it wins over the catch-all groups below.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      patch:
        patterns:
          - "*"
        update-types:
          - patch
      minor:
        patterns:
          - "*"
        update-types:
          - minor
