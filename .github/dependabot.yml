version: 2

updates:
  - package-ecosystem: npm
    directory: /
    rebase-strategy: auto
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    versioning-strategy: increase
    ignore:
      # Pinned to 1.0.0-beta.8: waku 1.0.0-beta.9 removed the router's
      # `unstable_events` API that vocs' ScrollRestoration still relies on,
      # which white-screens the docs site (react-dropzone#1512). Unpin once
      # vocs ships a release compatible with a newer waku beta.
      - dependency-name: "waku"
      # Held below 2.10: vocs 2.10 imports waku's `./router/client-core`, which
      # the pinned waku 1.0.0-beta.8 does not export, so `vocs build` fails and
      # the docs smoke test breaks (react-dropzone#1531). Raise this ceiling
      # together with the waku unpin above once the docs smoke test confirms a
      # compatible pair.
      - dependency-name: "vocs"
        versions:
          - ">=2.10.0"
    # Patch bumps grouped into one PR (auto-merged on green CI); minor bumps
    # grouped into a separate PR for manual review; majors open individually.
    groups:
      # Vitest and @vitest/coverage-v8 share a version-coupled coverage payload
      # format, so bumping one without the other breaks `vitest run --coverage`
      # (react-dropzone#1530). Keep them in lockstep across every update type;
      # listed first so it wins over the catch-all groups below.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      patch:
        patterns:
          - "*"
        update-types:
          - patch
      minor:
        patterns:
          - "*"
        update-types:
          - minor
