name: Docs uptime monitor

# Runs the same browser smoke test against the LIVE docs site on a schedule, so a
# broken production deploy (e.g. a dependency resolved differently on the host)
# is caught even when no PR triggered it. A failed run notifies repo admins via
# GitHub's default scheduled-workflow-failure email, and opens/updates an issue.
on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    name: Smoke-test live docs site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke-test https://react-dropzone.js.org
        run: npx playwright test
        env:
          DOCS_BASE_URL: https://react-dropzone.js.org

      - name: Open an issue if the live site is down
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Docs site smoke test failing";
            const body = `The scheduled docs smoke test failed against https://react-dropzone.js.org.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "docs-monitor"
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["docs-monitor"]
              });
            }
